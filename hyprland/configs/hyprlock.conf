# =============================================================================
# HYPRLOCK SOVEREIGN CONFIGURATION
# =============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(56, 189, 248, 0.8)
    inner_color = rgba(30, 41, 59, 0.8)
    font_color = rgb(241, 245, 249)
    fade_on_empty = false
    placeholder_text = <span foreground="##94a3b8">Enter Passphrase...</span>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(241, 245, 249, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(148, 163, 184, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
