services:
  qdrant:
    image: 'qdrant/qdrant:latest'
    environment:
      - SERVICE_URL_QDRANT_6333
      - 'QDRANT__SERVICE__API_KEY=${SERVICE_PASSWORD_QDRANTAPIKEY}'
    volumes:
      - 'qdrant-storage:/qdrant/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 3
