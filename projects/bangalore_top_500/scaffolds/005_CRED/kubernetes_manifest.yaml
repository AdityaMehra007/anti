apiVersion: apps/v1
kind: Deployment
metadata:
  name: cred-deployment
  labels:
    app: cred
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cred
  template:
    metadata:
      labels:
        app: cred
    spec:
      containers:
      - name: cred-node
        image: cred:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cred-service
spec:
  type: ClusterIP
  selector:
    app: cred
  ports:
  - port: 8080
    targetPort: 8080
