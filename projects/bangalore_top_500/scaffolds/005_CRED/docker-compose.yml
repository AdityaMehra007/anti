version: '3.8'

services:
  cred-core:
    image: python:3.13-slim
    container_name: cred-engine
    restart: always
    environment:
      - APP_NAME=CRED
      - PROJECT_NAME=Project VaultZero: Zero-Knowledge Sovereign High-Yield Private Neo-Banking Core & Real-Time Trust Ledger
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: cred-cache
    ports:
      - "6379"
