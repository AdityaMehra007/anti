apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex_ai-deployment
  labels:
    app: apex_ai
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apex_ai
  template:
    metadata:
      labels:
        app: apex_ai
    spec:
      containers:
      - name: apex_ai-node
        image: apex_ai:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: apex_ai-service
spec:
  type: ClusterIP
  selector:
    app: apex_ai
  ports:
  - port: 8080
    targetPort: 8080
