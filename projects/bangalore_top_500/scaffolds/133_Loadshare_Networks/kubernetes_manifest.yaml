apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadshare_networks-deployment
  labels:
    app: loadshare_networks
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loadshare_networks
  template:
    metadata:
      labels:
        app: loadshare_networks
    spec:
      containers:
      - name: loadshare_networks-node
        image: loadshare_networks:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loadshare_networks-service
spec:
  type: ClusterIP
  selector:
    app: loadshare_networks
  ports:
  - port: 8080
    targetPort: 8080
