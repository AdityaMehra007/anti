apiVersion: apps/v1
kind: Deployment
metadata:
  name: damensch-deployment
  labels:
    app: damensch
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: damensch
  template:
    metadata:
      labels:
        app: damensch
    spec:
      containers:
      - name: damensch-node
        image: damensch:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: damensch-service
spec:
  type: ClusterIP
  selector:
    app: damensch
  ports:
  - port: 8080
    targetPort: 8080
