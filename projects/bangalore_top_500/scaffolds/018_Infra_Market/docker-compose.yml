version: '3.8'

services:
  infra_market-core:
    image: python:3.13-slim
    container_name: infra_market-engine
    restart: always
    environment:
      - APP_NAME=Infra.Market
      - PROJECT_NAME=Project ConcreteOS: IoT Batching Plant Telemetry, Ready-Mix Real-Time Slump Optimization & Multi-Modal Fleet Router
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: infra_market-cache
    ports:
      - "6379"
