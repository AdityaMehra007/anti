version: '3.8'

services:
  log9_materials-core:
    image: python:3.13-slim
    container_name: log9_materials-engine
    restart: always
    environment:
      - APP_NAME=Log9 Materials
      - PROJECT_NAME=Project ChargeGrid-OS: Log9 Materials Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: log9_materials-cache
    ports:
      - "6379"
