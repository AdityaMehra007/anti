version: '3.8'

services:
  setu__pine_labs_-core:
    image: python:3.13-slim
    container_name: setu__pine_labs_-engine
    restart: always
    environment:
      - APP_NAME=Setu (Pine Labs)
      - PROJECT_NAME=Project AlphaYield: Setu (Pine Labs) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: setu__pine_labs_-cache
    ports:
      - "6379"
