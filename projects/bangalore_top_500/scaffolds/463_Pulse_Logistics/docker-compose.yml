version: '3.8'

services:
  pulse_logistics-core:
    image: python:3.13-slim
    container_name: pulse_logistics-engine
    restart: always
    environment:
      - APP_NAME=Pulse Logistics
      - PROJECT_NAME=Project OmniCatalog: Pulse Logistics Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: pulse_logistics-cache
    ports:
      - "6379"
