apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-deployment
  labels:
    app: flipkart
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flipkart
  template:
    metadata:
      labels:
        app: flipkart
    spec:
      containers:
      - name: flipkart-node
        image: flipkart:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flipkart-service
spec:
  type: ClusterIP
  selector:
    app: flipkart
  ports:
  - port: 8080
    targetPort: 8080
