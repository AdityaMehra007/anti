version: '3.8'

services:
  flipkart-core:
    image: python:3.13-slim
    container_name: flipkart-engine
    restart: always
    environment:
      - APP_NAME=Flipkart
      - PROJECT_NAME=Project TitanGrid: Sovereign Planetary-Scale Multi-Tenant Autonomous Logistics & Real-Time Fulfillment Mesh
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: flipkart-cache
    ports:
      - "6379"
