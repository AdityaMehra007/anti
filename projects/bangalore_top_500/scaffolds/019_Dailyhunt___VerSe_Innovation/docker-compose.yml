version: '3.8'

services:
  dailyhunt___verse_innovation-core:
    image: python:3.13-slim
    container_name: dailyhunt___verse_innovation-engine
    restart: always
    environment:
      - APP_NAME=Dailyhunt / VerSe Innovation
      - PROJECT_NAME=Project HyperSpeed-8: Dailyhunt / VerSe Innovation Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: dailyhunt___verse_innovation-cache
    ports:
      - "6379"
