apiVersion: apps/v1
kind: Deployment
metadata:
  name: cultsport-deployment
  labels:
    app: cultsport
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cultsport
  template:
    metadata:
      labels:
        app: cultsport
    spec:
      containers:
      - name: cultsport-node
        image: cultsport:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cultsport-service
spec:
  type: ClusterIP
  selector:
    app: cultsport
  ports:
  - port: 8080
    targetPort: 8080
