apiVersion: apps/v1
kind: Deployment
metadata:
  name: melorra-deployment
  labels:
    app: melorra
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: melorra
  template:
    metadata:
      labels:
        app: melorra
    spec:
      containers:
      - name: melorra-node
        image: melorra:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: melorra-service
spec:
  type: ClusterIP
  selector:
    app: melorra
  ports:
  - port: 8080
    targetPort: 8080
