apiVersion: apps/v1
kind: Deployment
metadata:
  name: chalo-deployment
  labels:
    app: chalo
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chalo
  template:
    metadata:
      labels:
        app: chalo
    spec:
      containers:
      - name: chalo-node
        image: chalo:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: chalo-service
spec:
  type: ClusterIP
  selector:
    app: chalo
  ports:
  - port: 8080
    targetPort: 8080
