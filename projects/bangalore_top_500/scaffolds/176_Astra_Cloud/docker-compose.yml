version: '3.8'

services:
  astra_cloud-core:
    image: python:3.13-slim
    container_name: astra_cloud-engine
    restart: always
    environment:
      - APP_NAME=Astra Cloud
      - PROJECT_NAME=Project ChargeGrid-OS: Astra Cloud Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: astra_cloud-cache
    ports:
      - "6379"
