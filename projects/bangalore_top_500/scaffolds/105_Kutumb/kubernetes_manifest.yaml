apiVersion: apps/v1
kind: Deployment
metadata:
  name: kutumb-deployment
  labels:
    app: kutumb
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kutumb
  template:
    metadata:
      labels:
        app: kutumb
    spec:
      containers:
      - name: kutumb-node
        image: kutumb:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kutumb-service
spec:
  type: ClusterIP
  selector:
    app: kutumb
  ports:
  - port: 8080
    targetPort: 8080
