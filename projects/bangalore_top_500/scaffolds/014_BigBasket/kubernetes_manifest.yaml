apiVersion: apps/v1
kind: Deployment
metadata:
  name: bigbasket-deployment
  labels:
    app: bigbasket
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bigbasket
  template:
    metadata:
      labels:
        app: bigbasket
    spec:
      containers:
      - name: bigbasket-node
        image: bigbasket:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bigbasket-service
spec:
  type: ClusterIP
  selector:
    app: bigbasket
  ports:
  - port: 8080
    targetPort: 8080
