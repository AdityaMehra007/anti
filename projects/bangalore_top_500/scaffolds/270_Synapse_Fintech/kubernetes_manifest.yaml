apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse_fintech-deployment
  labels:
    app: synapse_fintech
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: synapse_fintech
  template:
    metadata:
      labels:
        app: synapse_fintech
    spec:
      containers:
      - name: synapse_fintech-node
        image: synapse_fintech:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: synapse_fintech-service
spec:
  type: ClusterIP
  selector:
    app: synapse_fintech
  ports:
  - port: 8080
    targetPort: 8080
