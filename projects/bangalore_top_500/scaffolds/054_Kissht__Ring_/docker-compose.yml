version: '3.8'

services:
  kissht__ring_-core:
    image: python:3.13-slim
    container_name: kissht__ring_-engine
    restart: always
    environment:
      - APP_NAME=Kissht (Ring)
      - PROJECT_NAME=Project AlphaYield: Kissht (Ring) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: kissht__ring_-cache
    ports:
      - "6379"
