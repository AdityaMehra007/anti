apiVersion: apps/v1
kind: Deployment
metadata:
  name: udaan-deployment
  labels:
    app: udaan
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: udaan
  template:
    metadata:
      labels:
        app: udaan
    spec:
      containers:
      - name: udaan-node
        image: udaan:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: udaan-service
spec:
  type: ClusterIP
  selector:
    app: udaan
  ports:
  - port: 8080
    targetPort: 8080
