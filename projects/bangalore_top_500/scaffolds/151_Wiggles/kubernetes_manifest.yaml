apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiggles-deployment
  labels:
    app: wiggles
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wiggles
  template:
    metadata:
      labels:
        app: wiggles
    spec:
      containers:
      - name: wiggles-node
        image: wiggles:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wiggles-service
spec:
  type: ClusterIP
  selector:
    app: wiggles
  ports:
  - port: 8080
    targetPort: 8080
