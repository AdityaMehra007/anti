version: '3.8'

services:
  blackbuck__zinka_logistics_-core:
    image: python:3.13-slim
    container_name: blackbuck__zinka_logistics_-engine
    restart: always
    environment:
      - APP_NAME=BlackBuck (Zinka Logistics)
      - PROJECT_NAME=Project FleetAutonomy: BlackBuck (Zinka Logistics) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: blackbuck__zinka_logistics_-cache
    ports:
      - "6379"
