apiVersion: apps/v1
kind: Deployment
metadata:
  name: decentro-deployment
  labels:
    app: decentro
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: decentro
  template:
    metadata:
      labels:
        app: decentro
    spec:
      containers:
      - name: decentro-node
        image: decentro:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: decentro-service
spec:
  type: ClusterIP
  selector:
    app: decentro
  ports:
  - port: 8080
    targetPort: 8080
