apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra_space-deployment
  labels:
    app: astra_space
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astra_space
  template:
    metadata:
      labels:
        app: astra_space
    spec:
      containers:
      - name: astra_space-node
        image: astra_space:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: astra_space-service
spec:
  type: ClusterIP
  selector:
    app: astra_space
  ports:
  - port: 8080
    targetPort: 8080
