apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooter-deployment
  labels:
    app: rooter
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rooter
  template:
    metadata:
      labels:
        app: rooter
    spec:
      containers:
      - name: rooter-node
        image: rooter:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rooter-service
spec:
  type: ClusterIP
  selector:
    app: rooter
  ports:
  - port: 8080
    targetPort: 8080
