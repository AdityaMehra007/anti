version: '3.8'

services:
  pixxel_space-core:
    image: python:3.13-slim
    container_name: pixxel_space-engine
    restart: always
    environment:
      - APP_NAME=Pixxel Space
      - PROJECT_NAME=Project Aurora-HyperScale: Real-Time Orbital Edge Hyperspectral Imagery Ingestion & Planetary Anomaly Alerting Mesh
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: pixxel_space-cache
    ports:
      - "6379"
