version: '3.8'

services:
  zepto-core:
    image: python:3.13-slim
    container_name: zepto-engine
    restart: always
    environment:
      - APP_NAME=Zepto
      - PROJECT_NAME=Project Chronos-10: Predictive Micro-Depot Ingestion, Computer-Vision Darkstore Automated Picking & 300-Second Dispatch Pipeline
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: zepto-cache
    ports:
      - "6379"
