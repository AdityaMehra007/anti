version: '3.8'

services:
  plum_goodness-core:
    image: python:3.13-slim
    container_name: plum_goodness-engine
    restart: always
    environment:
      - APP_NAME=Plum Goodness
      - PROJECT_NAME=Project PrimeRoute: Plum Goodness Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: plum_goodness-cache
    ports:
      - "6379"
