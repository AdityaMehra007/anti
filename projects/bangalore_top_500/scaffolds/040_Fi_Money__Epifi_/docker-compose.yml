version: '3.8'

services:
  fi_money__epifi_-core:
    image: python:3.13-slim
    container_name: fi_money__epifi_-engine
    restart: always
    environment:
      - APP_NAME=Fi Money (Epifi)
      - PROJECT_NAME=Project NeoLedger: Fi Money (Epifi) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: fi_money__epifi_-cache
    ports:
      - "6379"
