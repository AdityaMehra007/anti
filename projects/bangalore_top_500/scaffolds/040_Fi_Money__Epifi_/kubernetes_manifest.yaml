apiVersion: apps/v1
kind: Deployment
metadata:
  name: fi_money__epifi_-deployment
  labels:
    app: fi_money__epifi_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fi_money__epifi_
  template:
    metadata:
      labels:
        app: fi_money__epifi_
    spec:
      containers:
      - name: fi_money__epifi_-node
        image: fi_money__epifi_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fi_money__epifi_-service
spec:
  type: ClusterIP
  selector:
    app: fi_money__epifi_
  ports:
  - port: 8080
    targetPort: 8080
