version: '3.8'

services:
  ola___ola_electric-core:
    image: python:3.13-slim
    container_name: ola___ola_electric-engine
    restart: always
    environment:
      - APP_NAME=Ola / Ola Electric
      - PROJECT_NAME=Project Gigafactory Core: Autonomous Edge Telemetry, 4680 Solid-State Cell Thermal Optimizer & Fleet Autopilot Mesh
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: ola___ola_electric-cache
    ports:
      - "6379"
