apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight_tiger-deployment
  labels:
    app: freight_tiger
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: freight_tiger
  template:
    metadata:
      labels:
        app: freight_tiger
    spec:
      containers:
      - name: freight_tiger-node
        image: freight_tiger:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: freight_tiger-service
spec:
  type: ClusterIP
  selector:
    app: freight_tiger
  ports:
  - port: 8080
    targetPort: 8080
