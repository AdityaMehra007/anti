version: '3.8'

services:
  grip_invest-core:
    image: python:3.13-slim
    container_name: grip_invest-engine
    restart: always
    environment:
      - APP_NAME=Grip Invest
      - PROJECT_NAME=Project AlphaYield: Grip Invest Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: grip_invest-cache
    ports:
      - "6379"
