apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupiter__amica_financial_-deployment
  labels:
    app: jupiter__amica_financial_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jupiter__amica_financial_
  template:
    metadata:
      labels:
        app: jupiter__amica_financial_
    spec:
      containers:
      - name: jupiter__amica_financial_-node
        image: jupiter__amica_financial_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: jupiter__amica_financial_-service
spec:
  type: ClusterIP
  selector:
    app: jupiter__amica_financial_
  ports:
  - port: 8080
    targetPort: 8080
