version: '3.8'

services:
  jupiter__amica_financial_-core:
    image: python:3.13-slim
    container_name: jupiter__amica_financial_-engine
    restart: always
    environment:
      - APP_NAME=Jupiter (Amica Financial)
      - PROJECT_NAME=Project AlphaYield: Jupiter (Amica Financial) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: jupiter__amica_financial_-cache
    ports:
      - "6379"
