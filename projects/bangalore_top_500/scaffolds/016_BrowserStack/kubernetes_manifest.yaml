apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserstack-deployment
  labels:
    app: browserstack
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: browserstack
  template:
    metadata:
      labels:
        app: browserstack
    spec:
      containers:
      - name: browserstack-node
        image: browserstack:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: browserstack-service
spec:
  type: ClusterIP
  selector:
    app: browserstack
  ports:
  - port: 8080
    targetPort: 8080
