version: '3.8'

services:
  browserstack-core:
    image: python:3.13-slim
    container_name: browserstack-engine
    restart: always
    environment:
      - APP_NAME=BrowserStack
      - PROJECT_NAME=Project HyperCloud-Test: Real-Time Hardware-Accelerated Virtualization Matrix & Autonomous AI Visual Bug Diagnoser
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: browserstack-cache
    ports:
      - "6379"
