version: '3.8'

services:
  liminal_custody-core:
    image: python:3.13-slim
    container_name: liminal_custody-engine
    restart: always
    environment:
      - APP_NAME=Liminal Custody
      - PROJECT_NAME=Project CyberShield: Liminal Custody Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: liminal_custody-cache
    ports:
      - "6379"
