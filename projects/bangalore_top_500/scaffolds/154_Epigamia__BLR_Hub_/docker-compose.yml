version: '3.8'

services:
  epigamia__blr_hub_-core:
    image: python:3.13-slim
    container_name: epigamia__blr_hub_-engine
    restart: always
    environment:
      - APP_NAME=Epigamia (BLR Hub)
      - PROJECT_NAME=Project OmniCatalog: Epigamia (BLR Hub) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: epigamia__blr_hub_-cache
    ports:
      - "6379"
