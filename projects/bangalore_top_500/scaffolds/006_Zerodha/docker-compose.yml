version: '3.8'

services:
  zerodha-core:
    image: python:3.13-slim
    container_name: zerodha-engine
    restart: always
    environment:
      - APP_NAME=Zerodha
      - PROJECT_NAME=Project NanoTrader-X: Sub-Microsecond FPGA/Kernel-Bypass Algorithmic Risk Gate & Multi-Exchange Sovereign Matching Fabric
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: zerodha-cache
    ports:
      - "6379"
