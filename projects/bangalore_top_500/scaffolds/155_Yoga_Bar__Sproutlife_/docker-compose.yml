version: '3.8'

services:
  yoga_bar__sproutlife_-core:
    image: python:3.13-slim
    container_name: yoga_bar__sproutlife_-engine
    restart: always
    environment:
      - APP_NAME=Yoga Bar (Sproutlife)
      - PROJECT_NAME=Project PrimeRoute: Yoga Bar (Sproutlife) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: yoga_bar__sproutlife_-cache
    ports:
      - "6379"
