version: '3.8'

services:
  snitch-core:
    image: python:3.13-slim
    container_name: snitch-engine
    restart: always
    environment:
      - APP_NAME=Snitch
      - PROJECT_NAME=Project OmniCatalog: Snitch Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: snitch-cache
    ports:
      - "6379"
