apiVersion: apps/v1
kind: Deployment
metadata:
  name: snitch-deployment
  labels:
    app: snitch
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: snitch
  template:
    metadata:
      labels:
        app: snitch
    spec:
      containers:
      - name: snitch-node
        image: snitch:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: snitch-service
spec:
  type: ClusterIP
  selector:
    app: snitch
  ports:
  - port: 8080
    targetPort: 8080
