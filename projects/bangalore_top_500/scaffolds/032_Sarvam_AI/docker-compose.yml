version: '3.8'

services:
  sarvam_ai-core:
    image: python:3.13-slim
    container_name: sarvam_ai-engine
    restart: always
    environment:
      - APP_NAME=Sarvam AI
      - PROJECT_NAME=Project RoboVision-3D: Sarvam AI Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: sarvam_ai-cache
    ports:
      - "6379"
