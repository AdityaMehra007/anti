apiVersion: apps/v1
kind: Deployment
metadata:
  name: signzy-deployment
  labels:
    app: signzy
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signzy
  template:
    metadata:
      labels:
        app: signzy
    spec:
      containers:
      - name: signzy-node
        image: signzy:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: signzy-service
spec:
  type: ClusterIP
  selector:
    app: signzy
  ports:
  - port: 8080
    targetPort: 8080
