apiVersion: apps/v1
kind: Deployment
metadata:
  name: kredx-deployment
  labels:
    app: kredx
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kredx
  template:
    metadata:
      labels:
        app: kredx
    spec:
      containers:
      - name: kredx-node
        image: kredx:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kredx-service
spec:
  type: ClusterIP
  selector:
    app: kredx
  ports:
  - port: 8080
    targetPort: 8080
