apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisle-deployment
  labels:
    app: aisle
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aisle
  template:
    metadata:
      labels:
        app: aisle
    spec:
      containers:
      - name: aisle-node
        image: aisle:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aisle-service
spec:
  type: ClusterIP
  selector:
    app: aisle
  ports:
  - port: 8080
    targetPort: 8080
