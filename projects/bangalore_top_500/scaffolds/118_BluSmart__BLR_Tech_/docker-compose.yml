version: '3.8'

services:
  blusmart__blr_tech_-core:
    image: python:3.13-slim
    container_name: blusmart__blr_tech_-engine
    restart: always
    environment:
      - APP_NAME=BluSmart (BLR Tech)
      - PROJECT_NAME=Project Telematics-Pulse: BluSmart (BLR Tech) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: blusmart__blr_tech_-cache
    ports:
      - "6379"
