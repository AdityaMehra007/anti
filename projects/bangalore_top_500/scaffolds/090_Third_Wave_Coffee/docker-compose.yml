version: '3.8'

services:
  third_wave_coffee-core:
    image: python:3.13-slim
    container_name: third_wave_coffee-engine
    restart: always
    environment:
      - APP_NAME=Third Wave Coffee
      - PROJECT_NAME=Project SwarmDispatch: Third Wave Coffee Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: third_wave_coffee-cache
    ports:
      - "6379"
