apiVersion: apps/v1
kind: Deployment
metadata:
  name: third_wave_coffee-deployment
  labels:
    app: third_wave_coffee
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: third_wave_coffee
  template:
    metadata:
      labels:
        app: third_wave_coffee
    spec:
      containers:
      - name: third_wave_coffee-node
        image: third_wave_coffee:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: third_wave_coffee-service
spec:
  type: ClusterIP
  selector:
    app: third_wave_coffee
  ports:
  - port: 8080
    targetPort: 8080
