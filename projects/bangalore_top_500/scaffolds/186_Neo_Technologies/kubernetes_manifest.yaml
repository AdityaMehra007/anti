apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo_technologies-deployment
  labels:
    app: neo_technologies
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neo_technologies
  template:
    metadata:
      labels:
        app: neo_technologies
    spec:
      containers:
      - name: neo_technologies-node
        image: neo_technologies:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: neo_technologies-service
spec:
  type: ClusterIP
  selector:
    app: neo_technologies
  ports:
  - port: 8080
    targetPort: 8080
