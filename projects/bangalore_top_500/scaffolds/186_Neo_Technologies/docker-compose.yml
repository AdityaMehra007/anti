version: '3.8'

services:
  neo_technologies-core:
    image: python:3.13-slim
    container_name: neo_technologies-engine
    restart: always
    environment:
      - APP_NAME=Neo Technologies
      - PROJECT_NAME=Project SwarmDispatch: Neo Technologies Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: neo_technologies-cache
    ports:
      - "6379"
