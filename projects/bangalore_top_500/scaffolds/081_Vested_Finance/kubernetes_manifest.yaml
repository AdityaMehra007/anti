apiVersion: apps/v1
kind: Deployment
metadata:
  name: vested_finance-deployment
  labels:
    app: vested_finance
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vested_finance
  template:
    metadata:
      labels:
        app: vested_finance
    spec:
      containers:
      - name: vested_finance-node
        image: vested_finance:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vested_finance-service
spec:
  type: ClusterIP
  selector:
    app: vested_finance
  ports:
  - port: 8080
    targetPort: 8080
