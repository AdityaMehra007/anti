version: '3.8'

services:
  vested_finance-core:
    image: python:3.13-slim
    container_name: vested_finance-engine
    restart: always
    environment:
      - APP_NAME=Vested Finance
      - PROJECT_NAME=Project SovereignCore: Vested Finance Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: vested_finance-cache
    ports:
      - "6379"
