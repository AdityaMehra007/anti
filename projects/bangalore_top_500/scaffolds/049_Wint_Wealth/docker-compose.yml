version: '3.8'

services:
  wint_wealth-core:
    image: python:3.13-slim
    container_name: wint_wealth-engine
    restart: always
    environment:
      - APP_NAME=Wint Wealth
      - PROJECT_NAME=Project SovereignCore: Wint Wealth Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: wint_wealth-cache
    ports:
      - "6379"
