version: '3.8'

services:
  neo_solutions-core:
    image: python:3.13-slim
    container_name: neo_solutions-engine
    restart: always
    environment:
      - APP_NAME=Neo Solutions
      - PROJECT_NAME=Project DataBridge: Neo Solutions Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: neo_solutions-cache
    ports:
      - "6379"
