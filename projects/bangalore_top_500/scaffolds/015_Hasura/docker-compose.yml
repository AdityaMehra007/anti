version: '3.8'

services:
  hasura-core:
    image: python:3.13-slim
    container_name: hasura-engine
    restart: always
    environment:
      - APP_NAME=Hasura
      - PROJECT_NAME=Project DataFabric-Core: Universal Zero-ETL GraphQL/SQL Multi-Cloud Query Engine with Distributed Vector Consensus
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: hasura-cache
    ports:
      - "6379"
