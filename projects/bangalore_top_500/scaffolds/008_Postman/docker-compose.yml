version: '3.8'

services:
  postman-core:
    image: python:3.13-slim
    container_name: postman-engine
    restart: always
    environment:
      - APP_NAME=Postman
      - PROJECT_NAME=Project API-Mesh-OS: Generative AI-Autonomous API Contract Synthesis, Real-Time Distributed Mocking & Self-Healing Gateway
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: postman-cache
    ports:
      - "6379"
