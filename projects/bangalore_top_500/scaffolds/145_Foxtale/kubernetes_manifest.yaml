apiVersion: apps/v1
kind: Deployment
metadata:
  name: foxtale-deployment
  labels:
    app: foxtale
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: foxtale
  template:
    metadata:
      labels:
        app: foxtale
    spec:
      containers:
      - name: foxtale-node
        image: foxtale:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: foxtale-service
spec:
  type: ClusterIP
  selector:
    app: foxtale
  ports:
  - port: 8080
    targetPort: 8080
