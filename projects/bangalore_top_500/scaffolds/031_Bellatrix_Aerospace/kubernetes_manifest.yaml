apiVersion: apps/v1
kind: Deployment
metadata:
  name: bellatrix_aerospace-deployment
  labels:
    app: bellatrix_aerospace
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bellatrix_aerospace
  template:
    metadata:
      labels:
        app: bellatrix_aerospace
    spec:
      containers:
      - name: bellatrix_aerospace-node
        image: bellatrix_aerospace:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bellatrix_aerospace-service
spec:
  type: ClusterIP
  selector:
    app: bellatrix_aerospace
  ports:
  - port: 8080
    targetPort: 8080
