version: '3.8'

services:
  bellatrix_aerospace-core:
    image: python:3.13-slim
    container_name: bellatrix_aerospace-engine
    restart: always
    environment:
      - APP_NAME=Bellatrix Aerospace
      - PROJECT_NAME=Project NeuroGen-Indic: Bellatrix Aerospace Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: bellatrix_aerospace-cache
    ports:
      - "6379"
