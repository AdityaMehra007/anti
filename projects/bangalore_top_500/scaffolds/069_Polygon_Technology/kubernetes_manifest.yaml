apiVersion: apps/v1
kind: Deployment
metadata:
  name: polygon_technology-deployment
  labels:
    app: polygon_technology
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: polygon_technology
  template:
    metadata:
      labels:
        app: polygon_technology
    spec:
      containers:
      - name: polygon_technology-node
        image: polygon_technology:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: polygon_technology-service
spec:
  type: ClusterIP
  selector:
    app: polygon_technology
  ports:
  - port: 8080
    targetPort: 8080
