apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradex-deployment
  labels:
    app: tradex
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tradex
  template:
    metadata:
      labels:
        app: tradex
    spec:
      containers:
      - name: tradex-node
        image: tradex:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tradex-service
spec:
  type: ClusterIP
  selector:
    app: tradex
  ports:
  - port: 8080
    targetPort: 8080
