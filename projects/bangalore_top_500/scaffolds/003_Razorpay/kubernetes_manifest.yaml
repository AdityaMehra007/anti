apiVersion: apps/v1
kind: Deployment
metadata:
  name: razorpay-deployment
  labels:
    app: razorpay
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: razorpay
  template:
    metadata:
      labels:
        app: razorpay
    spec:
      containers:
      - name: razorpay-node
        image: razorpay:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: razorpay-service
spec:
  type: ClusterIP
  selector:
    app: razorpay
  ports:
  - port: 8080
    targetPort: 8080
