version: '3.8'

services:
  razorpay-core:
    image: python:3.13-slim
    container_name: razorpay-engine
    restart: always
    environment:
      - APP_NAME=Razorpay
      - PROJECT_NAME=Project HyperMesh: Sovereign Zero-Latency Multi-Rail Autonomous Clearing & Settlement Ledger with Quantum-Safe Signatures
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: razorpay-cache
    ports:
      - "6379"
