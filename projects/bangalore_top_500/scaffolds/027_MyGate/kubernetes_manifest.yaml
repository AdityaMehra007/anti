apiVersion: apps/v1
kind: Deployment
metadata:
  name: mygate-deployment
  labels:
    app: mygate
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mygate
  template:
    metadata:
      labels:
        app: mygate
    spec:
      containers:
      - name: mygate-node
        image: mygate:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mygate-service
spec:
  type: ClusterIP
  selector:
    app: mygate
  ports:
  - port: 8080
    targetPort: 8080
