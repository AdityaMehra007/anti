version: '3.8'

services:
  ultraviolette_automotive-core:
    image: python:3.13-slim
    container_name: ultraviolette_automotive-engine
    restart: always
    environment:
      - APP_NAME=Ultraviolette Automotive
      - PROJECT_NAME=Project FleetAutonomy: Ultraviolette Automotive Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: ultraviolette_automotive-cache
    ports:
      - "6379"
