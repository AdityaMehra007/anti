apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni_energy-deployment
  labels:
    app: omni_energy
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omni_energy
  template:
    metadata:
      labels:
        app: omni_energy
    spec:
      containers:
      - name: omni_energy-node
        image: omni_energy:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: omni_energy-service
spec:
  type: ClusterIP
  selector:
    app: omni_energy
  ports:
  - port: 8080
    targetPort: 8080
