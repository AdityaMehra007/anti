apiVersion: apps/v1
kind: Deployment
metadata:
  name: emflux_motors-deployment
  labels:
    app: emflux_motors
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emflux_motors
  template:
    metadata:
      labels:
        app: emflux_motors
    spec:
      containers:
      - name: emflux_motors-node
        image: emflux_motors:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: emflux_motors-service
spec:
  type: ClusterIP
  selector:
    app: emflux_motors
  ports:
  - port: 8080
    targetPort: 8080
