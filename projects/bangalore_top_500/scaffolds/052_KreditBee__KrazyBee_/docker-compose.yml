version: '3.8'

services:
  kreditbee__krazybee_-core:
    image: python:3.13-slim
    container_name: kreditbee__krazybee_-engine
    restart: always
    environment:
      - APP_NAME=KreditBee (KrazyBee)
      - PROJECT_NAME=Project NeoLedger: KreditBee (KrazyBee) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: kreditbee__krazybee_-cache
    ports:
      - "6379"
