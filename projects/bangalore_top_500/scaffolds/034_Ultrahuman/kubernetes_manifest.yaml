apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultrahuman-deployment
  labels:
    app: ultrahuman
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ultrahuman
  template:
    metadata:
      labels:
        app: ultrahuman
    spec:
      containers:
      - name: ultrahuman-node
        image: ultrahuman:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ultrahuman-service
spec:
  type: ClusterIP
  selector:
    app: ultrahuman
  ports:
  - port: 8080
    targetPort: 8080
