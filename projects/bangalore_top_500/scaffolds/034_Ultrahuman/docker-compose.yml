version: '3.8'

services:
  ultrahuman-core:
    image: python:3.13-slim
    container_name: ultrahuman-engine
    restart: always
    environment:
      - APP_NAME=Ultrahuman
      - PROJECT_NAME=Project BioRing-Synapse: Real-Time Continuous Multi-Biomarker Synthesis, Sub-Second Glucose-Metabolism Telemetry & Preventative Longevity Coach
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: ultrahuman-cache
    ports:
      - "6379"
