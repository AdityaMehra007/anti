apiVersion: apps/v1
kind: Deployment
metadata:
  name: data_labs-deployment
  labels:
    app: data_labs
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data_labs
  template:
    metadata:
      labels:
        app: data_labs
    spec:
      containers:
      - name: data_labs-node
        image: data_labs:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: data_labs-service
spec:
  type: ClusterIP
  selector:
    app: data_labs
  ports:
  - port: 8080
    targetPort: 8080
