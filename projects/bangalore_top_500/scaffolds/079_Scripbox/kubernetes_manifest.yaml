apiVersion: apps/v1
kind: Deployment
metadata:
  name: scripbox-deployment
  labels:
    app: scripbox
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scripbox
  template:
    metadata:
      labels:
        app: scripbox
    spec:
      containers:
      - name: scripbox-node
        image: scripbox:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: scripbox-service
spec:
  type: ClusterIP
  selector:
    app: scripbox
  ports:
  - port: 8080
    targetPort: 8080
