apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile_premier_league__mpl_-deployment
  labels:
    app: mobile_premier_league__mpl_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mobile_premier_league__mpl_
  template:
    metadata:
      labels:
        app: mobile_premier_league__mpl_
    spec:
      containers:
      - name: mobile_premier_league__mpl_-node
        image: mobile_premier_league__mpl_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mobile_premier_league__mpl_-service
spec:
  type: ClusterIP
  selector:
    app: mobile_premier_league__mpl_
  ports:
  - port: 8080
    targetPort: 8080
