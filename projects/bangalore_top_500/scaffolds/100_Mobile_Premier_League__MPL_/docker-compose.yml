version: '3.8'

services:
  mobile_premier_league__mpl_-core:
    image: python:3.13-slim
    container_name: mobile_premier_league__mpl_-engine
    restart: always
    environment:
      - APP_NAME=Mobile Premier League (MPL)
      - PROJECT_NAME=Project HyperSpeed-8: Mobile Premier League (MPL) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: mobile_premier_league__mpl_-cache
    ports:
      - "6379"
