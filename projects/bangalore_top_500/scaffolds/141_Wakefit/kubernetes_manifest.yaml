apiVersion: apps/v1
kind: Deployment
metadata:
  name: wakefit-deployment
  labels:
    app: wakefit
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wakefit
  template:
    metadata:
      labels:
        app: wakefit
    spec:
      containers:
      - name: wakefit-node
        image: wakefit:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wakefit-service
spec:
  type: ClusterIP
  selector:
    app: wakefit
  ports:
  - port: 8080
    targetPort: 8080
