apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshtohome-deployment
  labels:
    app: freshtohome
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: freshtohome
  template:
    metadata:
      labels:
        app: freshtohome
    spec:
      containers:
      - name: freshtohome-node
        image: freshtohome:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: freshtohome-service
spec:
  type: ClusterIP
  selector:
    app: freshtohome
  ports:
  - port: 8080
    targetPort: 8080
