apiVersion: apps/v1
kind: Deployment
metadata:
  name: juspay-deployment
  labels:
    app: juspay
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: juspay
  template:
    metadata:
      labels:
        app: juspay
    spec:
      containers:
      - name: juspay-node
        image: juspay:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: juspay-service
spec:
  type: ClusterIP
  selector:
    app: juspay
  ports:
  - port: 8080
    targetPort: 8080
