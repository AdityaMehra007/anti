version: '3.8'

services:
  slurrp_farm-core:
    image: python:3.13-slim
    container_name: slurrp_farm-engine
    restart: always
    environment:
      - APP_NAME=Slurrp Farm
      - PROJECT_NAME=Project BrandOS: Slurrp Farm Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: slurrp_farm-cache
    ports:
      - "6379"
