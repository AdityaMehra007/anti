version: '3.8'

services:
  bureau_id-core:
    image: python:3.13-slim
    container_name: bureau_id-engine
    restart: always
    environment:
      - APP_NAME=Bureau.id
      - PROJECT_NAME=Project SovereignCore: Bureau.id Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: bureau_id-cache
    ports:
      - "6379"
