apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber_mobility-deployment
  labels:
    app: cyber_mobility
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cyber_mobility
  template:
    metadata:
      labels:
        app: cyber_mobility
    spec:
      containers:
      - name: cyber_mobility-node
        image: cyber_mobility:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cyber_mobility-service
spec:
  type: ClusterIP
  selector:
    app: cyber_mobility
  ports:
  - port: 8080
    targetPort: 8080
