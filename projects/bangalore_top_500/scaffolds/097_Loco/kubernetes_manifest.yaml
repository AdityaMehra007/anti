apiVersion: apps/v1
kind: Deployment
metadata:
  name: loco-deployment
  labels:
    app: loco
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loco
  template:
    metadata:
      labels:
        app: loco
    spec:
      containers:
      - name: loco-node
        image: loco:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: loco-service
spec:
  type: ClusterIP
  selector:
    app: loco
  ports:
  - port: 8080
    targetPort: 8080
