apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneytap__freo_-deployment
  labels:
    app: moneytap__freo_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moneytap__freo_
  template:
    metadata:
      labels:
        app: moneytap__freo_
    spec:
      containers:
      - name: moneytap__freo_-node
        image: moneytap__freo_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: moneytap__freo_-service
spec:
  type: ClusterIP
  selector:
    app: moneytap__freo_
  ports:
  - port: 8080
    targetPort: 8080
