version: '3.8'

services:
  moneytap__freo_-core:
    image: python:3.13-slim
    container_name: moneytap__freo_-engine
    restart: always
    environment:
      - APP_NAME=MoneyTap (Freo)
      - PROJECT_NAME=Project SovereignCore: MoneyTap (Freo) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: moneytap__freo_-cache
    ports:
      - "6379"
