version: '3.8'

services:
  kore_labs-core:
    image: python:3.13-slim
    container_name: kore_labs-engine
    restart: always
    environment:
      - APP_NAME=Kore Labs
      - PROJECT_NAME=Project OmniCatalog: Kore Labs Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: kore_labs-cache
    ports:
      - "6379"
