apiVersion: apps/v1
kind: Deployment
metadata:
  name: phonepe-deployment
  labels:
    app: phonepe
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: phonepe
  template:
    metadata:
      labels:
        app: phonepe
    spec:
      containers:
      - name: phonepe-node
        image: phonepe:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: phonepe-service
spec:
  type: ClusterIP
  selector:
    app: phonepe
  ports:
  - port: 8080
    targetPort: 8080
