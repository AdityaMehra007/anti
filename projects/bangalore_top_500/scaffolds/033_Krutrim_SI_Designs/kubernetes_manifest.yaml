apiVersion: apps/v1
kind: Deployment
metadata:
  name: krutrim_si_designs-deployment
  labels:
    app: krutrim_si_designs
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: krutrim_si_designs
  template:
    metadata:
      labels:
        app: krutrim_si_designs
    spec:
      containers:
      - name: krutrim_si_designs-node
        image: krutrim_si_designs:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: krutrim_si_designs-service
spec:
  type: ClusterIP
  selector:
    app: krutrim_si_designs
  ports:
  - port: 8080
    targetPort: 8080
