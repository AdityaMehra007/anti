version: '3.8'

services:
  krutrim_si_designs-core:
    image: python:3.13-slim
    container_name: krutrim_si_designs-engine
    restart: always
    environment:
      - APP_NAME=Krutrim SI Designs
      - PROJECT_NAME=Project OrbitMesh: Krutrim SI Designs Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: krutrim_si_designs-cache
    ports:
      - "6379"
