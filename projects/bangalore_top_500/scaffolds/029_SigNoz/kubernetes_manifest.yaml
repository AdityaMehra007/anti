apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-deployment
  labels:
    app: signoz
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signoz
  template:
    metadata:
      labels:
        app: signoz
    spec:
      containers:
      - name: signoz-node
        image: signoz:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-service
spec:
  type: ClusterIP
  selector:
    app: signoz
  ports:
  - port: 8080
    targetPort: 8080
