apiVersion: apps/v1
kind: Deployment
metadata:
  name: frnd-deployment
  labels:
    app: frnd
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frnd
  template:
    metadata:
      labels:
        app: frnd
    spec:
      containers:
      - name: frnd-node
        image: frnd:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frnd-service
spec:
  type: ClusterIP
  selector:
    app: frnd
  ports:
  - port: 8080
    targetPort: 8080
