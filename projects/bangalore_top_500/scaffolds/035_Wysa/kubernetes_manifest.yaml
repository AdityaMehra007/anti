apiVersion: apps/v1
kind: Deployment
metadata:
  name: wysa-deployment
  labels:
    app: wysa
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wysa
  template:
    metadata:
      labels:
        app: wysa
    spec:
      containers:
      - name: wysa-node
        image: wysa:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wysa-service
spec:
  type: ClusterIP
  selector:
    app: wysa
  ports:
  - port: 8080
    targetPort: 8080
