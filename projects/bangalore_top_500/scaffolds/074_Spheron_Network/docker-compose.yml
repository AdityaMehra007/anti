version: '3.8'

services:
  spheron_network-core:
    image: python:3.13-slim
    container_name: spheron_network-engine
    restart: always
    environment:
      - APP_NAME=Spheron Network
      - PROJECT_NAME=Project ZeroTrust-Core: Spheron Network Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: spheron_network-cache
    ports:
      - "6379"
