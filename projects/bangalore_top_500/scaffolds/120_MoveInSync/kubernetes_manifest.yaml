apiVersion: apps/v1
kind: Deployment
metadata:
  name: moveinsync-deployment
  labels:
    app: moveinsync
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moveinsync
  template:
    metadata:
      labels:
        app: moveinsync
    spec:
      containers:
      - name: moveinsync-node
        image: moveinsync:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: moveinsync-service
spec:
  type: ClusterIP
  selector:
    app: moveinsync
  ports:
  - port: 8080
    targetPort: 8080
