apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse_cloud-deployment
  labels:
    app: pulse_cloud
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pulse_cloud
  template:
    metadata:
      labels:
        app: pulse_cloud
    spec:
      containers:
      - name: pulse_cloud-node
        image: pulse_cloud:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pulse_cloud-service
spec:
  type: ClusterIP
  selector:
    app: pulse_cloud
  ports:
  - port: 8080
    targetPort: 8080
