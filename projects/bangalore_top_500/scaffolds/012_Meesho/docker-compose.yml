version: '3.8'

services:
  meesho-core:
    image: python:3.13-slim
    container_name: meesho-engine
    restart: always
    environment:
      - APP_NAME=Meesho
      - PROJECT_NAME=Project BharatMesh: Multilingual Voice/Visual Social Commerce Engine, 0-Commission P2P Reseller Supply Mesh & Tier-4 Logistics Arbiter
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: meesho-cache
    ports:
      - "6379"
