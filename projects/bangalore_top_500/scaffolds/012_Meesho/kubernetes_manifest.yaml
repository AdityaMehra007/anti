apiVersion: apps/v1
kind: Deployment
metadata:
  name: meesho-deployment
  labels:
    app: meesho
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meesho
  template:
    metadata:
      labels:
        app: meesho
    spec:
      containers:
      - name: meesho-node
        image: meesho:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: meesho-service
spec:
  type: ClusterIP
  selector:
    app: meesho
  ports:
  - port: 8080
    targetPort: 8080
