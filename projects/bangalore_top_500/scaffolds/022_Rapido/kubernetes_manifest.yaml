apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapido-deployment
  labels:
    app: rapido
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rapido
  template:
    metadata:
      labels:
        app: rapido
    spec:
      containers:
      - name: rapido-node
        image: rapido:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rapido-service
spec:
  type: ClusterIP
  selector:
    app: rapido
  ports:
  - port: 8080
    targetPort: 8080
