apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadowfax-deployment
  labels:
    app: shadowfax
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shadowfax
  template:
    metadata:
      labels:
        app: shadowfax
    spec:
      containers:
      - name: shadowfax-node
        image: shadowfax:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shadowfax-service
spec:
  type: ClusterIP
  selector:
    app: shadowfax
  ports:
  - port: 8080
    targetPort: 8080
