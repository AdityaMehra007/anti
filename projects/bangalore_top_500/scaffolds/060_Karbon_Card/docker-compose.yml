version: '3.8'

services:
  karbon_card-core:
    image: python:3.13-slim
    container_name: karbon_card-engine
    restart: always
    environment:
      - APP_NAME=Karbon Card
      - PROJECT_NAME=Project NeoLedger: Karbon Card Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: karbon_card-cache
    ports:
      - "6379"
