apiVersion: apps/v1
kind: Deployment
metadata:
  name: karbon_card-deployment
  labels:
    app: karbon_card
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: karbon_card
  template:
    metadata:
      labels:
        app: karbon_card
    spec:
      containers:
      - name: karbon_card-node
        image: karbon_card:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: karbon_card-service
spec:
  type: ClusterIP
  selector:
    app: karbon_card
  ports:
  - port: 8080
    targetPort: 8080
