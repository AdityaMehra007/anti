apiVersion: apps/v1
kind: Deployment
metadata:
  name: cult_fit__curefit_-deployment
  labels:
    app: cult_fit__curefit_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cult_fit__curefit_
  template:
    metadata:
      labels:
        app: cult_fit__curefit_
    spec:
      containers:
      - name: cult_fit__curefit_-node
        image: cult_fit__curefit_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cult_fit__curefit_-service
spec:
  type: ClusterIP
  selector:
    app: cult_fit__curefit_
  ports:
  - port: 8080
    targetPort: 8080
