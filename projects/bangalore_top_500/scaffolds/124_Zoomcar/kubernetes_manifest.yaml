apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoomcar-deployment
  labels:
    app: zoomcar
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zoomcar
  template:
    metadata:
      labels:
        app: zoomcar
    spec:
      containers:
      - name: zoomcar-node
        image: zoomcar:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zoomcar-service
spec:
  type: ClusterIP
  selector:
    app: zoomcar
  ports:
  - port: 8080
    targetPort: 8080
