apiVersion: apps/v1
kind: Deployment
metadata:
  name: instamojo-deployment
  labels:
    app: instamojo
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: instamojo
  template:
    metadata:
      labels:
        app: instamojo
    spec:
      containers:
      - name: instamojo-node
        image: instamojo:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: instamojo-service
spec:
  type: ClusterIP
  selector:
    app: instamojo
  ports:
  - port: 8080
    targetPort: 8080
