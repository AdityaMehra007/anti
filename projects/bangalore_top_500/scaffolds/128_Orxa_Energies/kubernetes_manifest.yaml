apiVersion: apps/v1
kind: Deployment
metadata:
  name: orxa_energies-deployment
  labels:
    app: orxa_energies
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orxa_energies
  template:
    metadata:
      labels:
        app: orxa_energies
    spec:
      containers:
      - name: orxa_energies-node
        image: orxa_energies:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orxa_energies-service
spec:
  type: ClusterIP
  selector:
    app: orxa_energies
  ports:
  - port: 8080
    targetPort: 8080
