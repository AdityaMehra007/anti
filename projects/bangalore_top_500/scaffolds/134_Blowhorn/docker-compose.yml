version: '3.8'

services:
  blowhorn-core:
    image: python:3.13-slim
    container_name: blowhorn-engine
    restart: always
    environment:
      - APP_NAME=Blowhorn
      - PROJECT_NAME=Project ChargeGrid-OS: Blowhorn Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: blowhorn-cache
    ports:
      - "6379"
