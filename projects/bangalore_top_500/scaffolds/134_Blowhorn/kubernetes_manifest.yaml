apiVersion: apps/v1
kind: Deployment
metadata:
  name: blowhorn-deployment
  labels:
    app: blowhorn
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blowhorn
  template:
    metadata:
      labels:
        app: blowhorn
    spec:
      containers:
      - name: blowhorn-node
        image: blowhorn:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: blowhorn-service
spec:
  type: ClusterIP
  selector:
    app: blowhorn
  ports:
  - port: 8080
    targetPort: 8080
