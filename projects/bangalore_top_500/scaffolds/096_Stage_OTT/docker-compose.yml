version: '3.8'

services:
  stage_ott-core:
    image: python:3.13-slim
    container_name: stage_ott-engine
    restart: always
    environment:
      - APP_NAME=Stage OTT
      - PROJECT_NAME=Project SwarmDispatch: Stage OTT Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: stage_ott-cache
    ports:
      - "6379"
