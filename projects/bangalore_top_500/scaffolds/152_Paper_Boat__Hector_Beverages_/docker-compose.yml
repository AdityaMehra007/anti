version: '3.8'

services:
  paper_boat__hector_beverages_-core:
    image: python:3.13-slim
    container_name: paper_boat__hector_beverages_-engine
    restart: always
    environment:
      - APP_NAME=Paper Boat (Hector Beverages)
      - PROJECT_NAME=Project PrimeRoute: Paper Boat (Hector Beverages) Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: paper_boat__hector_beverages_-cache
    ports:
      - "6379"
