apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper_boat__hector_beverages_-deployment
  labels:
    app: paper_boat__hector_beverages_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paper_boat__hector_beverages_
  template:
    metadata:
      labels:
        app: paper_boat__hector_beverages_
    spec:
      containers:
      - name: paper_boat__hector_beverages_-node
        image: paper_boat__hector_beverages_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: paper_boat__hector_beverages_-service
spec:
  type: ClusterIP
  selector:
    app: paper_boat__hector_beverages_
  ports:
  - port: 8080
    targetPort: 8080
