version: '3.8'

services:
  apex_energy-core:
    image: python:3.13-slim
    container_name: apex_energy-engine
    restart: always
    environment:
      - APP_NAME=Apex Energy
      - PROJECT_NAME=Project Web3-Consensus: Apex Energy Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: apex_energy-cache
    ports:
      - "6379"
