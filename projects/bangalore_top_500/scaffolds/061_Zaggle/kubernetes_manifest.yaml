apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaggle-deployment
  labels:
    app: zaggle
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zaggle
  template:
    metadata:
      labels:
        app: zaggle
    spec:
      containers:
      - name: zaggle-node
        image: zaggle:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zaggle-service
spec:
  type: ClusterIP
  selector:
    app: zaggle
  ports:
  - port: 8080
    targetPort: 8080
