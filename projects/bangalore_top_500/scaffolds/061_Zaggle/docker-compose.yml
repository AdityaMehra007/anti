version: '3.8'

services:
  zaggle-core:
    image: python:3.13-slim
    container_name: zaggle-engine
    restart: always
    environment:
      - APP_NAME=Zaggle
      - PROJECT_NAME=Project SovereignCore: Zaggle Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: zaggle-cache
    ports:
      - "6379"
