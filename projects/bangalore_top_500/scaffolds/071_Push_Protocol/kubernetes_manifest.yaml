apiVersion: apps/v1
kind: Deployment
metadata:
  name: push_protocol-deployment
  labels:
    app: push_protocol
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: push_protocol
  template:
    metadata:
      labels:
        app: push_protocol
    spec:
      containers:
      - name: push_protocol-node
        image: push_protocol:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: push_protocol-service
spec:
  type: ClusterIP
  selector:
    app: push_protocol
  ports:
  - port: 8080
    targetPort: 8080
