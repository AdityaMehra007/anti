version: '3.8'

services:
  push_protocol-core:
    image: python:3.13-slim
    container_name: push_protocol-engine
    restart: always
    environment:
      - APP_NAME=Push Protocol
      - PROJECT_NAME=Project ZeroTrust-Core: Push Protocol Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: push_protocol-cache
    ports:
      - "6379"
