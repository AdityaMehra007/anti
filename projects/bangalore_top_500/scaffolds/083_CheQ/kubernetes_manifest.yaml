apiVersion: apps/v1
kind: Deployment
metadata:
  name: cheq-deployment
  labels:
    app: cheq
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cheq
  template:
    metadata:
      labels:
        app: cheq
    spec:
      containers:
      - name: cheq-node
        image: cheq:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cheq-service
spec:
  type: ClusterIP
  selector:
    app: cheq
  ports:
  - port: 8080
    targetPort: 8080
