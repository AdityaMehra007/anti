apiVersion: apps/v1
kind: Deployment
metadata:
  name: open_secret-deployment
  labels:
    app: open_secret
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: open_secret
  template:
    metadata:
      labels:
        app: open_secret
    spec:
      containers:
      - name: open_secret-node
        image: open_secret:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: open_secret-service
spec:
  type: ClusterIP
  selector:
    app: open_secret
  ports:
  - port: 8080
    targetPort: 8080
