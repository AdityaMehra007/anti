version: '3.8'

services:
  nexa_works-core:
    image: python:3.13-slim
    container_name: nexa_works-engine
    restart: always
    environment:
      - APP_NAME=Nexa Works
      - PROJECT_NAME=Project GigForce-Core: Nexa Works Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: nexa_works-cache
    ports:
      - "6379"
