apiVersion: apps/v1
kind: Deployment
metadata:
  name: finbox-deployment
  labels:
    app: finbox
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finbox
  template:
    metadata:
      labels:
        app: finbox
    spec:
      containers:
      - name: finbox-node
        image: finbox:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: finbox-service
spec:
  type: ClusterIP
  selector:
    app: finbox
  ports:
  - port: 8080
    targetPort: 8080
