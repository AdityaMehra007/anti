version: '3.8'

services:
  synapse_space-core:
    image: python:3.13-slim
    container_name: synapse_space-engine
    restart: always
    environment:
      - APP_NAME=Synapse Space
      - PROJECT_NAME=Project RealEstate-Mesh: Synapse Space Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: synapse_space-cache
    ports:
      - "6379"
