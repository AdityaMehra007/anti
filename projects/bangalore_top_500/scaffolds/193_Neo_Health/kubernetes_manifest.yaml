apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo_health-deployment
  labels:
    app: neo_health
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neo_health
  template:
    metadata:
      labels:
        app: neo_health
    spec:
      containers:
      - name: neo_health-node
        image: neo_health:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: neo_health-service
spec:
  type: ClusterIP
  selector:
    app: neo_health
  ports:
  - port: 8080
    targetPort: 8080
