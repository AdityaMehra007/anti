version: '3.8'

services:
  router_protocol-core:
    image: python:3.13-slim
    container_name: router_protocol-engine
    restart: always
    environment:
      - APP_NAME=Router Protocol
      - PROJECT_NAME=Project Web3-Consensus: Router Protocol Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: router_protocol-cache
    ports:
      - "6379"
