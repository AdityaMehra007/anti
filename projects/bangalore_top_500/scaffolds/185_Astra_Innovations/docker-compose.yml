version: '3.8'

services:
  astra_innovations-core:
    image: python:3.13-slim
    container_name: astra_innovations-engine
    restart: always
    environment:
      - APP_NAME=Astra Innovations
      - PROJECT_NAME=Project SovereignCore: Astra Innovations Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: astra_innovations-cache
    ports:
      - "6379"
