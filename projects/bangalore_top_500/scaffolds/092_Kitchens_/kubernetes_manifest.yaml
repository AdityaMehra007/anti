apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchens_-deployment
  labels:
    app: kitchens_
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kitchens_
  template:
    metadata:
      labels:
        app: kitchens_
    spec:
      containers:
      - name: kitchens_-node
        image: kitchens_:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kitchens_-service
spec:
  type: ClusterIP
  selector:
    app: kitchens_
  ports:
  - port: 8080
    targetPort: 8080
