version: '3.8'

services:
  groww-core:
    image: python:3.13-slim
    container_name: groww-engine
    restart: always
    environment:
      - APP_NAME=Groww
      - PROJECT_NAME=Project WealthEngine: AI-Autonomous Retail Portfolio Rebalancer, Global Direct Market Access & Sovereign Multi-Asset Custody Core
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: groww-cache
    ports:
      - "6379"
