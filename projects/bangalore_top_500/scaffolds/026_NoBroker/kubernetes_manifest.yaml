apiVersion: apps/v1
kind: Deployment
metadata:
  name: nobroker-deployment
  labels:
    app: nobroker
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nobroker
  template:
    metadata:
      labels:
        app: nobroker
    spec:
      containers:
      - name: nobroker-node
        image: nobroker:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nobroker-service
spec:
  type: ClusterIP
  selector:
    app: nobroker
  ports:
  - port: 8080
    targetPort: 8080
