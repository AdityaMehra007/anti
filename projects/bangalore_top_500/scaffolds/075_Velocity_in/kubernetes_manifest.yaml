apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity_in-deployment
  labels:
    app: velocity_in
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: velocity_in
  template:
    metadata:
      labels:
        app: velocity_in
    spec:
      containers:
      - name: velocity_in-node
        image: velocity_in:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: velocity_in-service
spec:
  type: ClusterIP
  selector:
    app: velocity_in
  ports:
  - port: 8080
    targetPort: 8080
