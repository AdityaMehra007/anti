version: '3.8'

services:
  velocity_in-core:
    image: python:3.13-slim
    container_name: velocity_in-engine
    restart: always
    environment:
      - APP_NAME=Velocity.in
      - PROJECT_NAME=Project TrustVault: Velocity.in Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: velocity_in-cache
    ports:
      - "6379"
