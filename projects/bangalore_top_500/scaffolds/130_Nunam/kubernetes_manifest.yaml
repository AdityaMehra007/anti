apiVersion: apps/v1
kind: Deployment
metadata:
  name: nunam-deployment
  labels:
    app: nunam
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nunam
  template:
    metadata:
      labels:
        app: nunam
    spec:
      containers:
      - name: nunam-node
        image: nunam:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nunam-service
spec:
  type: ClusterIP
  selector:
    app: nunam
  ports:
  - port: 8080
    targetPort: 8080
