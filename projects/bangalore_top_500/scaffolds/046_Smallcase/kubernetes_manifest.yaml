apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallcase-deployment
  labels:
    app: smallcase
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smallcase
  template:
    metadata:
      labels:
        app: smallcase
    spec:
      containers:
      - name: smallcase-node
        image: smallcase:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smallcase-service
spec:
  type: ClusterIP
  selector:
    app: smallcase
  ports:
  - port: 8080
    targetPort: 8080
