version: '3.8'

services:
  zetwerk-core:
    image: python:3.13-slim
    container_name: zetwerk-engine
    restart: always
    environment:
      - APP_NAME=Zetwerk
      - PROJECT_NAME=Project HyperFab-Global: Autonomous Industrial Manufacturing Operating System, Distributed CNC Telemetry & Real-Time BOM Arbiter
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: zetwerk-cache
    ports:
      - "6379"
