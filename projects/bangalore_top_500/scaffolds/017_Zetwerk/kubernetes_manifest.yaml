apiVersion: apps/v1
kind: Deployment
metadata:
  name: zetwerk-deployment
  labels:
    app: zetwerk
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zetwerk
  template:
    metadata:
      labels:
        app: zetwerk
    spec:
      containers:
      - name: zetwerk-node
        image: zetwerk:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: zetwerk-service
spec:
  type: ClusterIP
  selector:
    app: zetwerk
  ports:
  - port: 8080
    targetPort: 8080
