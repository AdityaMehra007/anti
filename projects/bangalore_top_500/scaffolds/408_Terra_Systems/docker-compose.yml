version: '3.8'

services:
  terra_systems-core:
    image: python:3.13-slim
    container_name: terra_systems-engine
    restart: always
    environment:
      - APP_NAME=Terra Systems
      - PROJECT_NAME=Project CareerMatch-AI: Terra Systems Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: terra_systems-cache
    ports:
      - "6379"
