apiVersion: apps/v1
kind: Deployment
metadata:
  name: klub-deployment
  labels:
    app: klub
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: klub
  template:
    metadata:
      labels:
        app: klub
    spec:
      containers:
      - name: klub-node
        image: klub:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: klub-service
spec:
  type: ClusterIP
  selector:
    app: klub
  ports:
  - port: 8080
    targetPort: 8080
