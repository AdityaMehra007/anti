apiVersion: apps/v1
kind: Deployment
metadata:
  name: eatclub-deployment
  labels:
    app: eatclub
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eatclub
  template:
    metadata:
      labels:
        app: eatclub
    spec:
      containers:
      - name: eatclub-node
        image: eatclub:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: eatclub-service
spec:
  type: ClusterIP
  selector:
    app: eatclub
  ports:
  - port: 8080
    targetPort: 8080
