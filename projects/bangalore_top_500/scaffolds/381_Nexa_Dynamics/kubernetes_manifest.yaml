apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexa_dynamics-deployment
  labels:
    app: nexa_dynamics
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexa_dynamics
  template:
    metadata:
      labels:
        app: nexa_dynamics
    spec:
      containers:
      - name: nexa_dynamics-node
        image: nexa_dynamics:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nexa_dynamics-service
spec:
  type: ClusterIP
  selector:
    app: nexa_dynamics
  ports:
  - port: 8080
    targetPort: 8080
