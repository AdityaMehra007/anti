apiVersion: apps/v1
kind: Deployment
metadata:
  name: coinswitch_kuber-deployment
  labels:
    app: coinswitch_kuber
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coinswitch_kuber
  template:
    metadata:
      labels:
        app: coinswitch_kuber
    spec:
      containers:
      - name: coinswitch_kuber-node
        image: coinswitch_kuber:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: coinswitch_kuber-service
spec:
  type: ClusterIP
  selector:
    app: coinswitch_kuber
  ports:
  - port: 8080
    targetPort: 8080
