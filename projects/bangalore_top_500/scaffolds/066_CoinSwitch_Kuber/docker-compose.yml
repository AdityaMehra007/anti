version: '3.8'

services:
  coinswitch_kuber-core:
    image: python:3.13-slim
    container_name: coinswitch_kuber-engine
    restart: always
    environment:
      - APP_NAME=CoinSwitch Kuber
      - PROJECT_NAME=Project AlphaYield: CoinSwitch Kuber Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: coinswitch_kuber-cache
    ports:
      - "6379"
