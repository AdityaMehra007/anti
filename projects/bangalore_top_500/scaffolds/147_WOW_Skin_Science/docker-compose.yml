version: '3.8'

services:
  wow_skin_science-core:
    image: python:3.13-slim
    container_name: wow_skin_science-engine
    restart: always
    environment:
      - APP_NAME=WOW Skin Science
      - PROJECT_NAME=Project BrandOS: WOW Skin Science Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: wow_skin_science-cache
    ports:
      - "6379"
