version: '3.8'

services:
  euler_motors-core:
    image: python:3.13-slim
    container_name: euler_motors-engine
    restart: always
    environment:
      - APP_NAME=Euler Motors
      - PROJECT_NAME=Project Telematics-Pulse: Euler Motors Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: euler_motors-cache
    ports:
      - "6379"
