version: '3.8'

services:
  veda_data-core:
    image: python:3.13-slim
    container_name: veda_data-engine
    restart: always
    environment:
      - APP_NAME=Veda Data
      - PROJECT_NAME=Project B2B-Clearing: Veda Data Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: veda_data-cache
    ports:
      - "6379"
