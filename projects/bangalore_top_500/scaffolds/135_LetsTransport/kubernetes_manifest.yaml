apiVersion: apps/v1
kind: Deployment
metadata:
  name: letstransport-deployment
  labels:
    app: letstransport
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: letstransport
  template:
    metadata:
      labels:
        app: letstransport
    spec:
      containers:
      - name: letstransport-node
        image: letstransport:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: letstransport-service
spec:
  type: ClusterIP
  selector:
    app: letstransport
  ports:
  - port: 8080
    targetPort: 8080
