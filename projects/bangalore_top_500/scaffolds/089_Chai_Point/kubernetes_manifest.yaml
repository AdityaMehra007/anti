apiVersion: apps/v1
kind: Deployment
metadata:
  name: chai_point-deployment
  labels:
    app: chai_point
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chai_point
  template:
    metadata:
      labels:
        app: chai_point
    spec:
      containers:
      - name: chai_point-node
        image: chai_point:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: chai_point-service
spec:
  type: ClusterIP
  selector:
    app: chai_point
  ports:
  - port: 8080
    targetPort: 8080
