apiVersion: apps/v1
kind: Deployment
metadata:
  name: biconomy-deployment
  labels:
    app: biconomy
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: biconomy
  template:
    metadata:
      labels:
        app: biconomy
    spec:
      containers:
      - name: biconomy-node
        image: biconomy:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: biconomy-service
spec:
  type: ClusterIP
  selector:
    app: biconomy
  ports:
  - port: 8080
    targetPort: 8080
