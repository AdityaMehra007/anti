version: '3.8'

services:
  biconomy-core:
    image: python:3.13-slim
    container_name: biconomy-engine
    restart: always
    environment:
      - APP_NAME=Biconomy
      - PROJECT_NAME=Project CyberShield: Biconomy Enterprise System
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
    working_dir: /app
    command: python service_blueprint.py
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  redis-cache:
    image: redis:7-alpine
    container_name: biconomy-cache
    ports:
      - "6379"
