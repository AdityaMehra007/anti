apiVersion: apps/v1
kind: Deployment
metadata:
  name: locus_sh-deployment
  labels:
    app: locus_sh
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: locus_sh
  template:
    metadata:
      labels:
        app: locus_sh
    spec:
      containers:
      - name: locus_sh-node
        image: locus_sh:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: locus_sh-service
spec:
  type: ClusterIP
  selector:
    app: locus_sh
  ports:
  - port: 8080
    targetPort: 8080
