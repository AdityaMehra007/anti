<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Real-World Challenges — Autonomous Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --tag-bg: #1e293b;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 15px;
    }
    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f472b6 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .stats-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
    }
    .stat-pill span {
      font-weight: 700;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #374151;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .company-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }
    .lang-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .stack-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .tag {
      font-size: 11px;
      background: #1f2937;
      color: #e5e7eb;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .code-btn {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .code-btn:hover { background: #db2777; }
    .jobs-link {
      color: #60a5fa;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .jobs-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Frontend Real-World Challenges</h1>
      <p>Curated Open-Source Hiring Tests • 73 Enterprise Codebases</p>
    </div>
    <div class="stats-bar">
      <div class="stat-pill">Total Challenges: <span id="total-count">73</span></div>
      <div class="stat-pill">React Focus: <span>25 Tests</span></div>
      <div class="stat-pill">TypeScript: <span>11 Tests</span></div>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by company or technology (e.g., React, Redux, Typescript, AirCall)...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-stack="all">All</button>
      <button class="filter-btn" data-stack="React">React</button>
      <button class="filter-btn" data-stack="Typescript">TypeScript</button>
      <button class="filter-btn" data-stack="Vue">Vue</button>
      <button class="filter-btn" data-stack="Node">Node</button>
    </div>
  </div>

  <div class="listings-grid" id="listingsContainer"></div>

  <script>
    let allChallenges = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('data/frontend_challenges.json');
        allChallenges = await res.json();
        document.getElementById('total-count').textContent = allChallenges.length;
        render();
      } catch (err) {
        console.error('Failed to load JSON:', err);
      }
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('listingsContainer');
      container.innerHTML = '';

      const filtered = allChallenges.filter(item => {
        const matchStack = currentFilter === 'all' || item.stack.toLowerCase().includes(currentFilter.toLowerCase());
        const matchQuery = !q || 
          item.company_name.toLowerCase().includes(q) || 
          item.stack.toLowerCase().includes(q);
        return matchStack && matchQuery;
      });

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        const tags = item.stack.split(',').map(s => `<span class="tag">${s.trim()}</span>`).join('');
        const jobsBtn = (item.jobs_url && item.jobs_url !== '-') ? `<a href="${item.jobs_url}" target="_blank" class="jobs-link">Jobs on LinkedIn ↗</a>` : '<span></span>';
        
        card.innerHTML = `
          <div>
            <div class="card-head">
              <div class="company-title">${item.country || ''} ${item.company_name}</div>
              <span class="lang-badge">${item.lang.toUpperCase()}</span>
            </div>
            <div class="stack-tags">${tags}</div>
          </div>
          <div class="card-footer">
            ${jobsBtn}
            <a href="${item.challenge_url}" target="_blank" class="code-btn">View Challenge Code →</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.stack;
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
