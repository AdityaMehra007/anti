function renderRecruiters(list) {
  const grid = document.getElementById('recruiterGrid');
  grid.innerHTML = '';
  list.forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (r.sent ? ' sent' : '');
    card.id = 'card-' + idx;
    
    card.innerHTML = `
      <div class="card-head">
        <div>
          <span class="company-tag">${r.company}</span>
          <div class="recruiter-name">${r.recruiter_name}</div>
          <div class="role-target">${r.role}</div>
        </div>
        <label class="status-check">
          <input type="checkbox" onchange="toggleSent(${idx}, this.checked)" ${r.sent ? 'checked' : ''}>
          <span>Sent</span>
        </label>
      </div>

      <div class="note-box">
        <span class="char-badge">${r.note.length}/300 Chars (LinkedIn Invite Limit)</span>
        <div id="note-text-${idx}">${escapeHtml(r.note)}</div>
      </div>

      <div class="btn-group">
        <button class="btn btn-copy" id="btn-copy-${idx}" onclick="copyNote(${idx})">📋 Copy Note</button>
        <button class="btn btn-copy" onclick="copyInMail(${idx})">📄 Copy InMail</button>
        <a class="btn btn-open" href="${r.profile_url}" target="_blank" rel="noopener">🔗 Open Profile</a>
        <button class="btn btn-strike" onclick="strikeOne(${idx})">⚡ Copy & Open</button>
      </div>
    `;
    grid.appendChild(card);
  });
  updateStats();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function copyNote(idx) {
  const text = recruiters[idx].note;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy-' + idx);
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.classList.remove('copied');
    }, 2000);
  });
}

function copyInMail(idx) {
  const text = recruiters[idx].inmail;
  navigator.clipboard.writeText(text).then(() => {
    alert('Full InMail pitch copied to clipboard for ' + recruiters[idx].recruiter_name + '!');
  });
}

function strikeOne(idx) {
  const r = recruiters[idx];
  navigator.clipboard.writeText(r.note).then(() => {
    window.open(r.profile_url, '_blank');
    toggleSent(idx, true);
    const cb = document.querySelector('#card-' + idx + ' input[type="checkbox"]');
    if (cb) cb.checked = true;
  });
}

function toggleSent(idx, isSent) {
  recruiters[idx].sent = isSent;
  const card = document.getElementById('card-' + idx);
  if (card) {
    if (isSent) card.classList.add('sent');
    else card.classList.remove('sent');
  }
  updateStats();
}

function updateStats() {
  const sent = recruiters.filter(r => r.sent).length;
  document.getElementById('sentCount').innerText = sent;
  document.getElementById('totalCount').innerText = recruiters.length;
}

function filterRecruiters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = recruiters.filter(r => 
    r.company.toLowerCase().includes(q) ||
    r.recruiter_name.toLowerCase().includes(q) ||
    r.role.toLowerCase().includes(q)
  );
  renderRecruiters(filtered);
}

// Initial render
renderRecruiters(recruiters);
</script>
</body>
</html>
